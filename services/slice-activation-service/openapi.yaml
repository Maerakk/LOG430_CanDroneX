openapi: 3.0.3
info:
  title: CanDroneX Slice Activation et Service Inventory API
  version: 1.0.0
  description: |
    UC-06 : activer et configurer une slice (TMF640), et consulter l'inventaire des services (TMF638).
    Ce contrat est servi par slice-activation-service. La configuration est appliquée en arrière-plan par le
    NetworkProvisioningPort (MockOpen5GSAdapter en Phase 2). L'IMSI n'est jamais renvoyé.
servers:
  - url: http://localhost:8080
    description: API Gateway (routes publiques GET seulement)
security:
  - bearerAuth: []
tags:
  - name: service
  - name: internal
    description: Appelée seulement par service-ordering-service (absente de la passerelle).
paths:
  /api/slice-activation/v1/service:
    post:
      tags: [internal]
      operationId: requestServiceActivation
      summary: Demander l'activation d'un service pour un élément de commande (interne)
      description: |
        Idempotente par orderItemId, il n'y a jamais plus d'un Service par élément de commande.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivationRequest' }
      responses:
        '202':
          description: Service créé à l'état PENDING. L'activation se poursuit en arrière-plan.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Service' }
        '200':
          description: Rejeu, service existant renvoyé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Service' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: L'élément de commande a déjà un service pour un autre drone ou une autre offre.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Drone non éligible ou caractéristiques inapplicables (S-NSSAI incomplet).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: drone-management-service est indisponible, l'IMSI n'a pas pu être obtenu. Rien n'est créé.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    get:
      tags: [service]
      operationId: searchServices
      summary: Inventaire des services du client (filtre par commande)
      parameters:
        - { name: orderId, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: Services du client (au plus 200).
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Service' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/slice-activation/v1/service/{serviceId}:
    get:
      tags: [service]
      operationId: getService
      summary: Consulter l'état d'un service
      parameters:
        - { name: serviceId, in: path, required: true, schema: { type: string }, example: SVC-0a1b2c3d4e5f }
      responses:
        '200':
          description: Service du client.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Service' }
              example:
                id: SVC-0a1b2c3d4e5f
                state: ACTIVE
                droneId: DRN-0231
                orderId: SO-1a2b3c4d5e6f
                orderItemId: SO-1a2b3c4d5e6f-1
                serviceSpecification: { id: SPEC-C2-URLLC }
                serviceCharacteristic: [{ name: sst, valueType: integer, value: 2 }]
                acceptedAt: '2026-10-29T12:00:00.000Z'
                activatedAt: '2026-10-29T12:00:00.912Z'
                failureReason: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Characteristic:
      type: object
      required: [name, valueType, value]
      properties:
        name: { type: string, example: sst }
        valueType: { type: string, enum: [integer, string] }
        value: { oneOf: [{ type: integer }, { type: string }] }
    ActivationRequest:
      type: object
      required: [orderId, orderItemId, droneId, serviceSpecification, serviceCharacteristic, acceptedAt]
      properties:
        orderId: { type: string }
        orderItemId: { type: string }
        droneId: { type: string }
        serviceSpecification:
          type: object
          required: [id]
          properties: { id: { type: string } }
        serviceCharacteristic:
          type: array
          description: Doit contenir sliceType, sst, sd, dnn, 5qi, arp, ambrUplinkMbps, ambrDownlinkMbps.
          items: { $ref: '#/components/schemas/Characteristic' }
        acceptedAt: { type: string, format: date-time, description: Acceptation de la commande (mesure du délai). }
    Service:
      type: object
      required: [id, state, droneId, orderId, orderItemId, serviceSpecification, serviceCharacteristic, acceptedAt]
      properties:
        id: { type: string }
        state:
          type: string
          enum: [PENDING, ACTIVATING, ACTIVE, FAILED, UNKNOWN]
        droneId: { type: string }
        orderId: { type: string }
        orderItemId: { type: string }
        serviceSpecification:
          type: object
          properties: { id: { type: string } }
        serviceCharacteristic:
          type: array
          items: { $ref: '#/components/schemas/Characteristic' }
        acceptedAt: { type: string, format: date-time }
        activatedAt: { type: string, format: date-time, nullable: true }
        failureReason:
          type: string
          nullable: true
          description: "NETWORK_REJECTED quand le réseau refuse (état FAILED), NETWORK_TIMEOUT quand il ne répond pas après 3 essais (état UNKNOWN), INTERNAL_ERROR en cas d'erreur inattendue."
    Problem:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        correlationId: { type: string }
  responses:
    BadRequest:
      description: Requête mal formée.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Jeton absent ou invalide.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Service ou drone inexistant, ou appartenant à un autre client.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
