openapi: 3.0.3
info:
  title: CanDroneX Service Ordering et Service Catalog API
  version: 1.0.0
  description: |
    UC-04 : commander les services de connectivité d'un drone (TMF641), et consulter le catalogue des offres (TMF633).
    Ce contrat est servi par service-ordering-service. Dès qu'une commande est acceptée, chaque élément est envoyé
    à slice-activation-service pour être activé (UC-06). L'état des éléments suit ensuite l'état des services.
servers:
  - url: http://localhost:8080
    description: API Gateway
security:
  - bearerAuth: []
tags:
  - name: serviceOrder
  - name: serviceSpecification
paths:
  /api/service-ordering/v1/serviceOrder:
    post:
      tags: [serviceOrder]
      operationId: placeServiceOrder
      summary: Créer une commande de services pour un drone (UC-04)
      description: |
        Idempotente grâce à l'en-tête Idempotency-Key, propre à chaque client B2B. Avec la même clé et la même
        demande, la commande existante est renvoyée (200). Avec la même clé et une autre demande, la réponse est 409.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceOrderCreate' }
            example:
              orderItem:
                - { action: add, droneId: DRN-0231, service: { serviceSpecification: { id: SPEC-C2-URLLC } } }
                - { action: add, droneId: DRN-0231, service: { serviceSpecification: { id: SPEC-IMAGERY-EMBB } } }
      responses:
        '201':
          description: Commande acceptée. L'activation de chaque élément est demandée.
          headers:
            Location: { schema: { type: string }, example: /api/service-ordering/v1/serviceOrder/SO-1a2b3c4d5e6f }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceOrder' }
        '200':
          description: Rejeu identique, commande existante renvoyée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceOrder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Drone inexistant ou d'un autre client.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Clé d'idempotence réutilisée pour une autre demande, ou service déjà en cours d'activation ou actif pour ce drone.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Commande vide, plusieurs drones, offre en double ou inconnue, action autre que add, drone non éligible.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/service-ordering/v1/serviceOrder/{orderId}:
    get:
      tags: [serviceOrder]
      operationId: getServiceOrder
      summary: Suivre une commande et l'état de chaque élément
      description: |
        Rafraîchit l'état des éléments auprès de slice-activation-service. S'il est indisponible,
        la commande est renvoyée avec son dernier état connu.
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
          example: SO-1a2b3c4d5e6f
      responses:
        '200':
          description: Commande du client.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Commande inexistante ou d'un autre client.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/service-catalog/v1/serviceSpecification:
    get:
      tags: [serviceSpecification]
      operationId: listServiceSpecifications
      summary: Lister les offres du catalogue
      responses:
        '200':
          description: Offres et caractéristiques.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ServiceSpecification' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
      example: inspectra-2026-10-29-0001
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema: { type: string, pattern: '^[A-Za-z0-9._-]{1,128}$' }
  schemas:
    ServiceOrderCreate:
      type: object
      required: [orderItem]
      properties:
        orderItem:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ServiceOrderItemCreate' }
    ServiceOrderItemCreate:
      type: object
      required: [action, droneId, service]
      properties:
        action: { type: string, enum: [add], description: Seule l'action add est prise en charge en Phase 2. }
        droneId: { type: string, example: DRN-0231 }
        service:
          type: object
          required: [serviceSpecification]
          properties:
            serviceSpecification: { $ref: '#/components/schemas/SpecificationRef' }
    SpecificationRef:
      type: object
      required: [id]
      properties:
        id: { type: string, example: SPEC-C2-URLLC }
        name: { type: string, example: C2 Connectivity }
    ServiceOrder:
      type: object
      required: [id, state, acceptedAt, orderItem]
      properties:
        id: { type: string, example: SO-1a2b3c4d5e6f }
        state:
          type: string
          enum: [ACKNOWLEDGED, IN_PROGRESS, COMPLETED, PARTIALLY_COMPLETED, FAILED, CANCELLED]
          description: État global, calculé à partir de l'état des éléments.
        acceptedAt: { type: string, format: date-time }
        orderItem:
          type: array
          items: { $ref: '#/components/schemas/ServiceOrderItem' }
    ServiceOrderItem:
      type: object
      required: [id, action, state, droneId, service]
      properties:
        id: { type: string, example: SO-1a2b3c4d5e6f-1 }
        action: { type: string, enum: [add] }
        state: { type: string, enum: [PENDING, ACTIVATING, ACTIVE, FAILED, UNKNOWN, CANCELLED] }
        droneId: { type: string }
        service:
          type: object
          required: [serviceSpecification, serviceCharacteristic]
          properties:
            id:
              type: string
              nullable: true
              description: Identifiant du Service dans l'inventaire (null tant que l'activation n'a pas pu être demandée).
              example: SVC-0a1b2c3d4e5f
            serviceSpecification: { $ref: '#/components/schemas/SpecificationRef' }
            serviceCharacteristic:
              type: array
              description: Caractéristiques figées au moment de la commande.
              items: { $ref: '#/components/schemas/Characteristic' }
    Characteristic:
      type: object
      required: [name, valueType, value]
      properties:
        name: { type: string, example: sst }
        valueType: { type: string, enum: [integer, string] }
        value: { oneOf: [{ type: integer }, { type: string }], example: 2 }
    ServiceSpecification:
      type: object
      required: [id, name, sliceType, lifecycleStatus, serviceSpecCharacteristic]
      properties:
        id: { type: string, example: SPEC-C2-URLLC }
        name: { type: string, example: C2 Connectivity }
        sliceType: { type: string, enum: [URLLC, eMBB] }
        lifecycleStatus: { type: string, enum: [active, retired] }
        serviceSpecCharacteristic:
          type: array
          items: { $ref: '#/components/schemas/Characteristic' }
    Problem:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        correlationId: { type: string }
  responses:
    BadRequest:
      description: Requête mal formée (JSON illisible, champ manquant, Idempotency-Key absente).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Jeton absent ou invalide.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unavailable:
      description: drone-management-service ne répond pas à temps. Aucune commande n'est créée.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InternalError:
      description: Erreur inattendue.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
