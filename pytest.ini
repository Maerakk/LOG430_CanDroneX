[pytest]
pythonpath =
    common
    services/drone-management-service
    services/service-ordering-service
    services/slice-activation-service
    tests
testpaths =
    services/drone-management-service/tests
    services/service-ordering-service/tests
    services/slice-activation-service/tests
    tests/integration
    tests/contract
addopts = --import-mode=importlib
markers =
    stack: needs the full docker compose stack (gateway + Keycloak)
