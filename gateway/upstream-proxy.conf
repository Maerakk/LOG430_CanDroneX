# KrakenD CE renvoie un 500 vide si un service est injoignable : nginx répond 503/504 en Problem Details
# resolve : suit les nouvelles adresses IP quand un service est recréé
resolver 127.0.0.11 valid=10s ipv6=off;
upstream drone-management-service { zone drone 64k; server drone-management-service:8000 resolve max_fails=0; keepalive 128; }
upstream service-ordering-service { zone ordering 64k; server service-ordering-service:8000 resolve max_fails=0; keepalive 128; }
upstream slice-activation-service { zone activation 64k; server slice-activation-service:8000 resolve max_fails=0; keepalive 128; }

map $uri $upstream_service {
    ~^/api/drone-management/  drone-management-service;
    ~^/api/service-ordering/  service-ordering-service;
    ~^/api/service-catalog/   service-ordering-service;
    ~^/api/slice-activation/  slice-activation-service;
    default                   "";
}

server {
    listen 8000;
    access_log off;
    keepalive_requests 100000;

    location / {
        if ($upstream_service = "") { return 404; }
        proxy_pass http://$upstream_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 1s;
        proxy_read_timeout 4500ms;
        proxy_intercept_errors off;
        error_page 502 503 = @unavailable;
        error_page 504 = @timeout;
    }

    location @unavailable {
        default_type application/problem+json;
        add_header X-Correlation-Id $http_x_correlation_id always;
        return 503 '{"type":"https://candronex.example/problems/service-unavailable","title":"Service Unavailable","status":503,"detail":"The $upstream_service is unavailable.","instance":"$uri","correlationId":"$http_x_correlation_id"}';
    }

    location @timeout {
        default_type application/problem+json;
        add_header X-Correlation-Id $http_x_correlation_id always;
        return 504 '{"type":"https://candronex.example/problems/gateway-timeout","title":"Gateway Timeout","status":504,"detail":"The $upstream_service did not answer in time.","instance":"$uri","correlationId":"$http_x_correlation_id"}';
    }
}
